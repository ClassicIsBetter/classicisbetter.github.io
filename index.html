
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classics Page</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="profile">

        <img
            class="avatar"
            src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-316814348532A8F53085DFCD564A50DF-Png/150/150/AvatarHeadshot/Webp/noFilter"
            width="50"
        >

        <div class="display-name">Classic_IsBetter</div>

        <div class="username">@Minecraft_boy236</div>

        <p class="stats">
            <span id="friends">Loading...</span> friends,
            <span id="following">Loading...</span> following,
            <span id="followers">Loading...</span> followers
        </p>

    </div>


    <script>
const STATS_API = "https://roblox-profile-stats.silly-search-api.workers.dev/";

async function updateStats() {
    try {
        const response = await fetch(STATS_API);
        const data = await response.json();

        document.getElementById("friends").textContent = data.friends;
        document.getElementById("following").textContent = data.following;
        document.getElementById("followers").textContent = data.followers;

    } catch (error) {
        console.error("Could not update Roblox stats:", error);
    }
}

updateStats();

setInterval(updateStats, 10000);
    </script>

</body>
</html>
