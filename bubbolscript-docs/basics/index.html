<!DOCTYPE html>
<html lang="en">
<head>
    <title>BubbolScript Documentation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="title">Bubbolscript Documentation</h1>
    <div class="topic-box">
        <h2>Printing</h2>
        <p>Printing can be used to output strings, integers and variables</p>
        <p>When used to output variables, it will output the value of the variable</p>
        <p>Here is an example of Print being used:</p>
        <div class="code-example-bg">
            
            <div class="code-box">
                <p>variable score 5</p>
                <p>print score</p>
            </div>
            <div class="code-output">
                <h3>output:</h3>
                <p>5</p>
            </div>
        </div>
    </div>
</body>
