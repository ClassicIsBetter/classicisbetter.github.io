<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BubbolScript Documentation</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1 class="title">BubbolScript Documentation</h1>
    </header>
    <main>
        <section class="topic-box">
            <h2>Printing</h2>
            <p>Printing can be used to output strings, integers and variables.</p>
            <p>When used to output variables, it will output the value of the variable.</p>
            <p>Here is an example of print being used:</p>
            <div class="code-box">
                <pre><code><span class="keyword">variable</span> score 5
<span class="keyword">print</span> score</code></pre>
            </div>
            <div class="code-output">
                <h3>Output</h3>
                <pre><code>5</code></pre>
            </div>
        </section>
    </main>
</body>
</html>
